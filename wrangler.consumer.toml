name = "literate-reviews-worker"
main = "src/consumer/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Bundle `.md` files as string modules. Lets the LangGraph node
# `import` its system prompt from `src/consumer/prompts/analyze.md`
# rather than embedding it as a template literal.
rules = [
  { type = "Text", globs = ["**/*.md"], fallthrough = true }
]

# The consumer has no `fetch` handler — it only responds to queue
# messages. Suppress the public workers.dev URL and its per-version
# preview URLs so there's no HTTP surface to reach it at.
workers_dev = false
preview_urls = false

# Replace with the ID of your registered GitHub App before manual deployment.
[vars]
GITHUB_APP_ID = "YOUR_GITHUB_APP_ID"

[[queues.consumers]]
queue = "literate-reviews"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 4
