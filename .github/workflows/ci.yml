name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: nothing in this workflow writes to the repo via
# GITHUB_TOKEN. Locking it down closes the door if a future action or
# dependency ever tries to.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR checks; finish each main validation run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Runs both Workers through wrangler's real bundle path without
      # deploying. Catches things that typecheck and unit tests can't:
      # a missing wrangler module rule for a new file extension, a
      # Workers-runtime incompat in a dep, or an entrypoint typo in
      # either wrangler toml. No Cloudflare credentials needed.
      - run: pnpm build
